name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: go fmt ./...

      - name: Verify formatting
        run: git diff --exit-code

      - name: Verify module files
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check documentation
        if: runner.os == 'Linux'
        run: python3 scripts/check-docs.py

      - name: Test
        run: go test ./...

      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build
        run: go build ./...

      - name: Package and smoke-test native release archive
        shell: bash
        run: |
          bash scripts/package-release.sh v0.0.0-smoke dist "$(go env GOOS)/$(go env GOARCH)"
          python3 scripts/verify-release.py --native-only dist v0.0.0-smoke
