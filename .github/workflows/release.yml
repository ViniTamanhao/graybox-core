name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $VERSION"
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag does not point to a commit on main"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Package release
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME" dist

      - name: Verify archives and native executable
        run: python3 scripts/verify-release.py dist "$GITHUB_REF_NAME"

      - name: Upload verified archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/
          retention-days: 7

  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist
      - name: Verify archives and native executable
        shell: bash
        run: python3 scripts/verify-release.py dist "$GITHUB_REF_NAME"

  publish:
    needs: [release, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist
      - name: Verify downloaded checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"

          EXTRA_ARGS=()

          if [[ "$VERSION" == *-* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$VERSION" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Graybox ${VERSION}" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
